name: CI

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/gabriel-valin/backend-go-for-cluster-config    # minúsculas! GHCR exige

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # para publicar no GHCR via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do cluster-config
        uses: actions/checkout@v4
        with:
          repository: Gabriel-Valin/cluster-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Atualiza a tag da imagem (API + Worker)
        run: |
          for FILE in apps/orders/api-deployment.yml apps/orders/worker-deployment.yml; do
            sed -i "s|image: ghcr.io/gabriel-valin/backend-go-for-cluster-config:.*|image: ghcr.io/gabriel-valin/backend-go-for-cluster-config:${{ github.sha }}|" "$FILE"
          done

      - name: Commit e push
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          echo "=== diff após o sed ==="
          git diff --stat            # mostra se algo mudou de fato

          git add apps/orders/api-deployment.yml apps/orders/worker-deployment.yml

          if git diff --cached --quiet; then
            echo "NADA para commitar — o sed provavelmente não casou a linha image:"
            grep "image:" apps/orders/api-deployment.yml apps/orders/worker-deployment.yml
            exit 1                   # falha o job para você VER o problema
          fi

          git commit -m "deploy: backend-go-for-cluster-config ${{ github.sha }}"
          git push
